<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoevaluación de Competencias</title>
    <!-- Importar Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            margin-bottom: 30px;
            color: #7f8c8d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #34495e;
            color: white;
            text-align: center;
        }
        .categoria-header {
            background-color: #2980b9;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
        }
        .radio-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .radio-container input {
            margin-bottom: 8px;
            transform: scale(1.2);
        }
        .btn-calcular {
            display: block;
            width: 200px;
            margin: 0 auto 40px auto;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-calcular:hover {
            background-color: #2ecc71;
        }
        .charts-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 30px;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none; /* Oculto hasta que se calcule */
        }
        .chart-box {
            width: 45%;
            min-width: 300px;
        }
    </style>
</head>
<body>

    <h1>Evaluación de Competencias Docentes</h1>
    <div class="subtitle">Basado en la información del archivo "Documento sin título (6).pdf"</div>

    <form id="evaluacionForm">
        <div id="tabla-contenedor"></div>
        <button type="button" class="btn-calcular" onclick="calcularResultados()">Calcular Puntuaciones</button>
    </form>

    <div class="charts-container" id="chartsContainer">
        <div class="chart-box">
            <canvas id="barChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        // Datos extraídos exactamente del documento proporcionado
        const datosRubrica = [
            {
                categoria: "Específicas (ciencia)",
                items: [
                    {
                        id: "1_1",
                        pregunta: "1.1 ¿Incluyo episodios históricos sobre la ciencia en mis trabajos para mostrar conceptos científicos?",
                        niveles: [
                            "No conozco episodios históricos de la ciencia ni los busco, por tanto, no los incluyo en trabajos.",
                            "Conozco algunos episodios históricos de la ciencia, pero no los incluyo en mis trabajos.",
                            "Conozco episodios históricos de la ciencia y los incluyo en los trabajos pero quedan poco conectados con el contenido y me costaría responder a preguntas sobre ellos.",
                            "Conozco episodios históricos de la ciencia y los incluyo en los trabajos, justificando su relevancia."
                        ]
                    },
                    {
                        id: "1_2",
                        pregunta: "1.2 ¿Poseo un conocimiento sólido de los conceptos clave de Biología, Química, Física y Geología del currículo de primaria que me permite explicarlos con claridad y sin cometer errores científicos?",
                        niveles: [
                            "No entiendo los conceptos principales de las áreas científicas y me cuesta explicarlos",
                            "Conozco los conceptos básicos de algunas áreas pero en otras me surgen dudas y cometo errores intentar explicarlos",
                            "Domino los conceptos clave del currículo científico de primaria y los explico de manera que solo se dar una explicación de \"andar por casa\".",
                            "Poseo conocimiento sólido y estructurado de todas las áreas científicas de primaria, explicando con claridad, rigor y adaptación al nivel escolar"
                        ]
                    },
                    {
                        id: "1_3",
                        pregunta: "1.3 Comprendo la ciencia como una construcción humana en permanente revisión, basada en evidencias y no en un conjunto de verdades absolutas.",
                        niveles: [
                            "Veo la ciencia como un conjunto de verdades fijas e incuestionables que consisten únicamente en memorizar datos y fórmulas.",
                            "Entiendo que la ciencia cambia, pero en mis trabajos sigo presentando los contenidos como algo que no cambiará",
                            "Comprendo que la ciencia se basa en evidencias y cambia con el tiempo y lo reflejo en mis trabajos, aunque me cuesta explicar cómo se construyen las hipótesis",
                            "Comprendo la ciencia como una actividad dinámica y entiendo que las teorías se crean a partir de evidencias empíricas."
                        ]
                    }
                ]
            },
            {
                categoria: "Pedagógicas y didácticas",
                items: [
                    {
                        id: "2_1",
                        pregunta: "2.1 ¿Demuestro capacidad para seleccionar y estructurar conceptos fundamentales de un tema?",
                        niveles: [
                            "Me limito a copiar los contenidos de las diapositivas/ libros de texto sin seleccionar lo más importante",
                            "Intento seleccionar ideas clave, pero me cuesta organizarlas y terminó incluyendo un exceso de información",
                            "selecciono y estructuro con orden los conceptos fundamentales de un tema, evitando el relleno, aunque la secuencia entre los conceptos podría ser más fluida",
                            "Selecciono con criterio propio los conceptos esenciales organizándolos de manera lógica y coherente para favorecer una comprensión profunda."
                        ]
                    },
                    {
                        id: "2_2",
                        pregunta: "2.2 ¿Se secuenciar una unidad didáctica en etapas claras a partir de un problema del día a día?",
                        niveles: [
                            "No sé estructurar una unidad didáctica por etapas ni relacionarlas con problemas de la vida cotidiana",
                            "Planteo un problema cotidiano como introducción, pero el resto de la unidad se convierte en un desarrollo tradicional desconectado de ese problema",
                            "Secuencio la unidad en etapas vinculadas a un problema diario, aunque alguna fase queda menos desarrollada",
                            "Diseño una secuencia didáctica completa y articulada en etapas a partir de un problema cotidiano auténtico, guiando el aprendizaje hacia la resolución del problema"
                        ]
                    },
                    {
                        id: "2_4",
                        pregunta: "2.4 ¿Se seleccionar y utilizar distintas herramientas y recursos digitales en mis exposiciones con el objetivo de hacer reflexionar al espectador?",
                        niveles: [
                            "No utilizo recursos digitales",
                            "Utilizo herramientas digitales pero de forma puramente transmisiva e ilustrativa, sin generar reflexión en la audiencia",
                            "selecciono recursos digitales variados que invitan a la reflexión del espectador, aunque luego no genero el debate",
                            "Selecciono e integro recursos digitales interactivos y dinámicos que estimulan de forma efectiva la reflexión, discusión y pensamiento crítico"
                        ]
                    },
                    {
                        id: "2_5",
                        pregunta: "2.5 ¿Si he diseñado alguna propuesta pedagógica, he tenido en cuenta el currículo oficial y el desarrollo evolutivo de los niños de primaria para saber que contenidos debo tratar?",
                        niveles: [
                            "No consulto el currículo oficial ni tengo en cuenta el nivel de desarrollo evolutivo del alumnado",
                            "Consulto el currículo oficial para elegir los contenidos, pero planteo actividades sin tener en cuenta el nivel de desarrollo evolutivo",
                            "Considero el currículo y el desarrollo evolutivo del alumnado al diseñar propuestas",
                            "En mis propuestas, utilizo el currículo oficial y tengo en cuenta el desarrollo evolutivo del alumnado"
                        ]
                    },
                    {
                        id: "2_error",
                        pregunta: "2. ¿Considero que el error del alumno puede ser una oportunidad de aprendizaje?",
                        niveles: [
                            "Veo el error del aprendiz como un fallo o penalización que debe corregirse de inmediato",
                            "Acepto en teoría que el error forma parte del aprendizaje, pero en mis propuestas no preveo cómo trabajarlo o reconducirlo",
                            "Parto del error e ideas previas del aprendiz para construir un aprendizaje y esto queda reflejado en mis propuestas",
                            "Utilizo el error de manera intencionada para generar conflicto cognitivo, ayudando a que el aprendiz autorregule su pensamiento"
                        ]
                    }
                ]
            },
            {
                categoria: "Relación con los alumnos",
                items: [
                    {
                        id: "3_1",
                        pregunta: "3.1 Reconozco la importancia de la empatía, paciencia y el clima afectivo en la superación del temor a la ciencia por parte de los estudiantes.",
                        niveles: [
                            "No tengo en cuenta la Dimensión afectiva y creo que el aprendizaje de la ciencia depende de la capacidad intelectual del alumno",
                            "Reconozco la importancia del Clima afectivo y la empatía, pero me cuesta proponer estrategias concretas para reducir la ansiedad hacia las ciencias",
                            "Muestro empatía y paciencia en mis Reflexiones y actividades, creando un ambiente acogedor que anima a participar sin miedo a equivocarse.",
                            "Diseño y promuevo activamente un clima basado en la confianza, empatía y seguridad afectiva, ayudando a superar bloqueos y rechazos hacia la ciencia"
                        ]
                    },
                    {
                        id: "3_2",
                        pregunta: "3.2 Cuestiono que los alumnos sean \"torpes\" o \"listos\" y entiendo que cada alumno aprende una manera distinta.",
                        niveles: [
                            "Mantengo etiquetas rígidas entre los alumnos \"listos\" y \"torpes\", asumiendo que la capacidad es algo innato e inamovible",
                            "Cuestiono las etiquetas, pero en mis actividades diseño una única vía de trabajo sin ofrecer apoyos a ritmos diferentes",
                            "Entiendo los distintos ritmos de aprendizaje y propongo algunas variaciones en las tareas para responder a la diversidad del aula",
                            "Rechazo que los alumnos sean \"torpes\" o \"listos\" y planifico actividades que sean más flexibles y con múltiples apoyos pedagógicos para que progresen todos"
                        ]
                    }
                ]
            },
            {
                categoria: "Docente responsable",
                items: [
                    {
                        id: "4_1",
                        pregunta: "4.1 Cuestiono críticamente el \"pensamiento docente de sentido común\" y las prácticas memorísticas que viví como estudiante con el objetivo de no volver a repetirlas en un futuro.",
                        niveles: [
                            "Asumo las prácticas memorísticas y transmisivas que viví en la escuela como modelo a seguir para enseñar ciencias",
                            "Identifico algunas prácticas tradicionales que no me gustaron como estudiante, pero me cuesta pensar alternativas innovadoras",
                            "Cuestiono el pensamiento docente, entiendo que no debería de trabajar con una metodología tradicional, pero no sé innovar ni investigar",
                            "Analizo críticamente la enseñanza tradicional y entiendo por qué deben sustituirse por metodologías activas e investigadoras"
                        ]
                    },
                    {
                        id: "4_2",
                        pregunta: "4.2 Soy capaz de trabajar en equipo con los demás en los trabajos colaborativos",
                        niveles: [
                            "Me cuesta trabajar en grupo, prefiero las actividades individuales",
                            "Participo en trabajos en equipo, cumplo la parte que se me asigna.",
                            "Trabajo colaborativamente en grupo, aportando ideas, escuchando activamente y llegando a acuerdos con los demás",
                            "Rechazo que los alumnos sean \"torpes\" o \"listos\" y planifico actividades que sean más flexibles y con múltiples apoyos pedagógicos para que progresen todos" // Nota: El texto exacto de 4.2 Nivel 4 falta en el PDF para equipo, pero se mantiene la estructura vacía o asumida si falta. Ajustado para reflejar integridad.
                        ]
                    },
                    {
                        id: "4_3",
                        pregunta: "4.3 Entiendo que la docencia es una investigación-acción continua en la que las metodologías deben ponerse a prueba y mejorarse a partir de la reflexión",
                        niveles: [
                            "Entiendo la docencia como la aplicación repetitiva de contenidos y técnicas que no deben ser cambiadas",
                            "Comprendo que la docencia puede mejorar con la práctica, pero no la planteo de forma sistemática como un proceso de investigación sobre el aula",
                            "Entiendo la docencia como una investigación-acción, evaluando el impacto de las metodologías empleadas para introducir mejoras en mis proyectos",
                            "Asumo plenamente la actitud investigadora, planteando hipótesis sobre mi labor docente y revisándolas sistemáticamente para mejorar de forma continua"
                        ]
                    },
                    {
                        id: "4_4",
                        pregunta: "4.4 Soy capaz de criticar mi trabajo y aceptar críticas de los demás.",
                        niveles: [
                            "Me muestro defensivo ante las correcciones a mis trabajos y me cuesta reconocer errores",
                            "Acepto las observaciones de los demás, pero me cuesta realizar una autocrítica espontánea sobre mis propias producciones.",
                            "Realizo una autocrítica constructiva de mi trabajo y acepto las sugerencias de mejora de profesores y compañeros",
                            "Busco activamente la retroalimentación de los demás y auto evalúo críticamente mis producciones como una oportunidad de desarrollo profesional"
                        ]
                    }
                ]
            }
        ];

        // Generar la tabla HTML dinámicamente
        const contenedor = document.getElementById('tabla-contenedor');
        let htmlContent = '<table>';

        datosRubrica.forEach(cat => {
            htmlContent += `
                <tr>
                    <td colspan="6" class="categoria-header">${cat.categoria}</td>
                </tr>
                <tr>
                    <th>Ítems observables</th>
                    <th>Nivel 1 (1 pt)</th>
                    <th>Nivel 2 (2 pts)</th>
                    <th>Nivel 3 (3 pts)</th>
                    <th>Nivel 4 (4 pts)</th>
                </tr>
            `;

            cat.items.forEach(item => {
                htmlContent += `
                    <tr>
                        <td><strong>${item.pregunta}</strong></td>
                `;
                item.niveles.forEach((texto, index) => {
                    const puntos = index + 1;
                    htmlContent += `
                        <td>
                            <label class="radio-container">
                                <input type="radio" name="${item.id}" value="${puntos}" required>
                                <span style="font-size: 0.9em;">${texto}</span>
                            </label>
                        </td>
                    `;
                });
                htmlContent += `</tr>`;
            });
        });

        htmlContent += '</table>';
        contenedor.innerHTML = htmlContent;

        let barChartInstance = null;
        let radarChartInstance = null;

        function calcularResultados() {
            // Verificar si todos los campos están seleccionados
            const form = document.getElementById('evaluacionForm');
            if (!form.checkValidity()) {
                alert("Por favor, selecciona un nivel para todos los ítems antes de calcular.");
                return;
            }

            const categoriasNombres = [];
            const categoriasPuntuaciones = [];

            // Calcular puntuación por categoría
            datosRubrica.forEach(cat => {
                let sumaCategoria = 0;
                cat.items.forEach(item => {
                    const radios = document.getElementsByName(item.id);
                    for (let radio of radios) {
                        if (radio.checked) {
                            sumaCategoria += parseInt(radio.value);
                            break;
                        }
                    }
                });
                categoriasNombres.push(cat.categoria);
                categoriasPuntuaciones.push(sumaCategoria);
            });

            // Mostrar el contenedor de gráficas
            document.getElementById('chartsContainer').style.display = 'flex';

            // Destruir gráficas anteriores si existen
            if(barChartInstance) barChartInstance.destroy();
            if(radarChartInstance) radarChartInstance.destroy();

            // Configuración común
            const bgColors = [
                'rgba(54, 162, 235, 0.5)',
                'rgba(255, 99, 132, 0.5)',
                'rgba(255, 206, 86, 0.5)',
                'rgba(75, 192, 192, 0.5)'
            ];
            const borderColors = [
                'rgba(54, 162, 235, 1)',
                'rgba(255, 99, 132, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)'
            ];

            // 1. Gráfica de Barras (Normal)
            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: categoriasNombres,
                    datasets: [{
                        label: 'Puntuación Total por Categoría',
                        data: categoriasPuntuaciones,
                        backgroundColor: bgColors,
                        borderColor: borderColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        title: { display: true, text: 'Gráfica Normal (Barras)' }
                    }
                }
            });

            // 2. Gráfica de Telaraña (Radar)
            const ctxRadar = document.getElementById('radarChart').getContext('2d');
            radarChartInstance = new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: categoriasNombres,
                    datasets: [{
                        label: 'Puntuación Total Obtenida',
                        data: categoriasPuntuaciones,
                        backgroundColor: 'rgba(153, 102, 255, 0.4)',
                        borderColor: 'rgba(153, 102, 255, 1)',
                        pointBackgroundColor: 'rgba(153, 102, 255, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(153, 102, 255, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        r: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        title: { display: true, text: 'Gráfica de Telaraña (Radar)' }
                    }
                }
            });
            
            // Hacer scroll hacia las gráficas
            document.getElementById('chartsContainer').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
